<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#332014"/>
      <stop offset=".28" stop-color="#24160e"/>
      <stop offset=".5" stop-color="#2e1b10"/>
      <stop offset=".72" stop-color="#1a100a"/>
      <stop offset="1" stop-color="#29180e"/>
    </linearGradient>
    <linearGradient id="warmth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c08145" stop-opacity=".14"/>
      <stop offset=".4" stop-color="#8b572f" stop-opacity=".08"/>
      <stop offset=".7" stop-color="#1a0f09" stop-opacity=".1"/>
      <stop offset="1" stop-color="#0b0604" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="plankA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2d1a" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#24150d" stop-opacity=".35"/>
      <stop offset="1" stop-color="#392315" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="plankB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28180f" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#3e2717" stop-opacity=".45"/>
      <stop offset="1" stop-color="#21130c" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".62" stop-color="#000" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000" stop-opacity=".52"/>
    </radialGradient>
    <filter id="grainLight" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.13" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="luminanceToAlpha" result="alpha"/>
      <feComponentTransfer in="alpha" result="streaks">
        <feFuncA type="linear" slope="2.4" intercept="-1.05"/>
      </feComponentTransfer>
      <feFlood flood-color="#b07a48" flood-opacity=".5" result="color"/>
      <feComposite in="color" in2="streaks" operator="in"/>
    </filter>
    <filter id="grainDark" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.16" numOctaves="4" seed="29" result="noise"/>
      <feColorMatrix in="noise" type="luminanceToAlpha" result="alpha"/>
      <feComponentTransfer in="alpha" result="streaks">
        <feFuncA type="linear" slope="2.8" intercept="-1.2"/>
      </feComponentTransfer>
      <feFlood flood-color="#0d0704" flood-opacity=".55" result="color"/>
      <feComposite in="color" in2="streaks" operator="in"/>
    </filter>
    <filter id="speckle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="6" result="n"/>
      <feColorMatrix in="n" type="luminanceToAlpha" result="a"/>
      <feComponentTransfer in="a">
        <feFuncA type="linear" slope=".09" intercept="0"/>
      </feComponentTransfer>
      <feFlood flood-color="#e0b483" flood-opacity="1" result="c"/>
      <feComposite in="c" in2="a" operator="in"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#warmth)"/>

  <rect x="0" y="0" width="1600" height="250" fill="url(#plankA)"/>
  <rect x="0" y="250" width="1600" height="250" fill="url(#plankB)"/>
  <rect x="0" y="500" width="1600" height="250" fill="url(#plankA)"/>
  <rect x="0" y="750" width="1600" height="250" fill="url(#plankB)"/>

  <rect width="1600" height="1000" filter="url(#grainLight)" opacity=".5"/>
  <rect width="1600" height="1000" filter="url(#grainDark)" opacity=".55"/>

  <g stroke="#080503" stroke-opacity=".9">
    <line x1="0" y1="250" x2="1600" y2="250" stroke-width="4"/>
    <line x1="0" y1="500" x2="1600" y2="500" stroke-width="5"/>
    <line x1="0" y1="750" x2="1600" y2="750" stroke-width="4"/>
  </g>
  <g stroke="#8a5b34" stroke-opacity=".22">
    <line x1="0" y1="254" x2="1600" y2="254" stroke-width="2"/>
    <line x1="0" y1="505" x2="1600" y2="505" stroke-width="2"/>
    <line x1="0" y1="754" x2="1600" y2="754" stroke-width="2"/>
  </g>

  <g opacity=".45">
    <ellipse cx="280" cy="380" rx="38" ry="14" fill="#0e0805" opacity=".6"/>
    <ellipse cx="280" cy="380" rx="70" ry="24" fill="none" stroke="#4a2d18" stroke-width="3"/>
    <ellipse cx="280" cy="380" rx="96" ry="33" fill="none" stroke="#3a2312" stroke-width="2"/>
    <ellipse cx="1180" cy="860" rx="30" ry="11" fill="#0c0704" opacity=".55"/>
    <ellipse cx="1180" cy="860" rx="58" ry="20" fill="none" stroke="#4a2d18" stroke-width="2.5"/>
    <ellipse cx="1180" cy="860" rx="82" ry="28" fill="none" stroke="#35200f" stroke-width="2"/>
  </g>

  <rect width="1600" height="1000" filter="url(#speckle)" opacity=".5"/>
  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>
